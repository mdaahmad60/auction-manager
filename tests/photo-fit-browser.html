<!doctype html><html><head><meta charset="utf-8"><title>Photo fit test</title><link rel="stylesheet" href="../themes/mmm.css"></head><body><pre id="result">RUNNING</pre>
<div style="width:200px;height:200px;position:relative;overflow:hidden"><img id="bid-player-photo" alt="Test tall portrait"></div>
<div style="width:200px;height:200px;position:relative;overflow:hidden"><img id="mmm-photo" alt="Test wide portrait"></div>
<style>#bid-player-photo,#mmm-photo{transition:none}</style>
<script>
(async () => {
 const images=[document.getElementById('bid-player-photo'),document.getElementById('mmm-photo')];
 try {
  await Promise.all(images.map((image,i)=>new Promise((resolve,reject)=>{image.onload=resolve;image.onerror=reject;image.src='data:image/svg+xml,'+encodeURIComponent(`<svg xmlns="http://www.w3.org/2000/svg" width="${i?400:100}" height="${i?100:400}"><rect width="100%" height="100%" fill="purple"/></svg>`);})));
  for (const image of images) {
   for (const [alignment,fraction] of [['top',0],['center',.5],['bottom',1]]) {
    image.dataset.verticalAlign=alignment;
    const rect=image.getBoundingClientRect(), frame=image.parentElement.getBoundingClientRect();
    const height=200*image.naturalHeight/image.naturalWidth;
    if(Math.abs(rect.width-200)>.1 || Math.abs(rect.height-height)>.1 || Math.abs(rect.top-(frame.top+(200-height)*fraction))>.1) throw new Error(image.id+': '+alignment+' geometry incorrect');
   }
  }
  document.getElementById('result').textContent='PASS: both overlays fit width, preserve aspect ratio, and align top/center/bottom for tall and wide photos';
 } catch(error) {document.getElementById('result').textContent='FAIL: '+error.message;}
})();
</script></body></html>
