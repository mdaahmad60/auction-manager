<!doctype html><html lang="en"><head><meta charset="utf-8"><title>ISPL preview</title><link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&display=swap" rel="stylesheet"><link rel="stylesheet" href="../themes/mmm.css"><link rel="stylesheet" href="../themes/ispl.css"><style>body{margin:0;background:#24332f}#display-app{position:relative;width:1920px;height:1080px}nav{position:absolute;left:500px;top:25px;z-index:10}button{padding:12px;margin:4px}</style></head><body><div id="display-app"><nav><button onclick="preview('intro')">intro</button><button onclick="preview('bidding')">bidding</button><button onclick="preview('sold')">sold</button><button onclick="preview('unsold')">unsold</button><button onclick="preview('purse')">purse</button><button onclick="preview('squad')">squad</button></nav><section id="ispl-overlay" hidden></section>    <section id="mmm-overlay" hidden aria-label="Auction broadcast" data-phase="intro">
        <div class="mmm-card">
            <div class="mmm-portrait"><div id="mmm-initials" class="mmm-initials"></div><img id="mmm-photo" alt="Player portrait" referrerpolicy="no-referrer" hidden><div class="mmm-unsold">UNSOLD</div></div>
            <div class="mmm-info">
                <div class="mmm-heading"><span id="mmm-name" class="mmm-name"></span><span id="mmm-role" class="mmm-role"></span></div>
                <div id="mmm-intro-facts" class="mmm-facts"></div>
            </div>
            <div id="mmm-bid-ribbon" class="mmm-ribbon" hidden><div class="mmm-wing"><span class="mmm-label">Base price</span><span id="mmm-base" class="mmm-value"></span></div><div class="mmm-wing"><span class="mmm-label">Current bid</span><span id="mmm-bid" class="mmm-value"></span></div></div>
            <div id="mmm-sale-ribbon" class="mmm-ribbon" hidden><div class="mmm-team"><div id="mmm-logo-left" class="mmm-logo"></div><span id="mmm-team-name" class="mmm-team-name"></span></div><div class="mmm-sale"><div><span class="mmm-label">Sold at</span><span id="mmm-sold-price" class="mmm-value"></span></div><div id="mmm-logo-right" class="mmm-logo mmm-hammer" role="img" aria-label="Auction hammer: sold">
                <svg viewBox="0 0 76 76" aria-hidden="true" focusable="false">
                    <ellipse class="mmm-impact-ring" cx="41" cy="60" rx="19" ry="5" fill="none" stroke="#c5ff5c" stroke-width="2"/>
                    <g class="mmm-hammer-tool">
                        <path d="M36 28 L57 49" stroke="#eed5ff" stroke-width="7" stroke-linecap="round"/>
                        <rect x="19" y="17" width="28" height="17" rx="4" transform="rotate(-42 33 25)" fill="#f6efff"/>
                        <path d="M22 32 L35 20 M30 39 L43 27" stroke="#c49af1" stroke-width="3"/>
                    </g>
                    <g class="mmm-impact-sparks" stroke="#c5ff5c" stroke-width="2.5" stroke-linecap="round"><path d="M20 47 L15 42 M39 43 L39 36 M55 48 L61 43"/></g>
                    <rect x="24" y="56" width="34" height="7" rx="3.5" fill="#e5cbff"/>
                    <rect x="20" y="64" width="42" height="3" rx="1.5" fill="#9c68d2"/>
                </svg>
            </div></div></div>
            <div class="mmm-caption"><strong id="mmm-caption-name"></strong><span id="mmm-caption-role"></span></div>
        </div>
    </section></div><script src="../themes/mmm.js"></script><script src="../themes/ispl.js"></script><script>
function preview(phase){
 clearTimeout(mmmDisplay.timer);mmmDisplay.result=null;
 const player={name:'Jayesh Patil',role:'Batter',category:'East Zone',phase};
 const teams=Array.from({length:10},(_,i)=>({name:'Demo Team '+(i+1),purse:2150000+i*25000,playerList:Array(11+i).fill({})}));
 receiveMMM({type:'SYNC_ALL',settings:{theme:'ispl',showBidding:true,isplView:['purse','squad'].includes(phase)?phase:'player'},teams,currentPlayer:player,base:300000,bid:320000});
 if(['sold','unsold'].includes(phase)) {receiveMMM({type:phase==='sold'?'SOLD_CELEBRATION':'UNSOLD_ANIMATION',playerDetails:player,team:'Demo Lions',bid:320000});clearTimeout(mmmDisplay.timer);}
}
preview(new URLSearchParams(location.search).get('phase')||'intro');
</script></body></html>
